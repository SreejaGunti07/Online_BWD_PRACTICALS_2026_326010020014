<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .box {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        input {
            width: 200px;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0b7dda;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Student Result</h1>

        <label>English:</label>
        <input type="number" id="english" placeholder="Enter marks"><br>

        <label>Mathematics:</label>
        <input type="number" id="maths" placeholder="Enter marks"><br>

        <label>Computer:</label>
        <input type="number" id="computer" placeholder="Enter marks"><br>

        <label>Science:</label>
        <input type="number" id="science" placeholder="Enter marks"><br>

        <label>Web Development:</label>
        <input type="number" id="web" placeholder="Enter marks"><br><br>

        <button onclick="calculateResult()">Calculate Result</button>

        <div id="result"></div>

    </div>

    <script>

        // Function to calculate result
        function calculateResult() {

            // Getting marks from input fields
            let english = Number(document.getElementById("english").value);
            let maths = Number(document.getElementById("maths").value);
            let computer = Number(document.getElementById("computer").value);
            let science = Number(document.getElementById("science").value);
            let web = Number(document.getElementById("web").value);

            // Calculate total
            let total = english + maths + computer + science + web;

            // Calculate percentage
            let percentage = total / 5;

            // Calculate grade using conditional statements
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            // Display result
            document.getElementById("result").innerHTML =
                "<h2>Result</h2>" +
                "Total Marks: " + total + " / 500<br>" +
                "Percentage: " + percentage.toFixed(2) + "%<br>" +
                "Grade: " + grade;
        }

    </script>

</body>
</html>
