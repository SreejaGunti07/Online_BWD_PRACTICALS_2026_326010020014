<!DOCTYPE html>
<html>
<head>
    <title>Subject Information</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .box {
            background-color: white;
            width: 450px;
            margin: auto;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h1 {
            color: #2196f3;
        }

        select {
            padding: 10px;
            width: 250px;
            margin: 15px;
        }

        #info {
            background-color: #e3f2fd;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            text-align: left;
        }

        button {
            padding: 10px 20px;
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0b7dda;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Subject Information</h1>

        <p>Select a subject:</p>

        <!-- Subject List -->
        <select id="subject" onchange="showSubjectInfo()">
            <option value="">-- Select Subject --</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="database">Database Management</option>
            <option value="cprogramming">C Programming</option>
        </select>

        <!-- Information will be displayed here -->
        <div id="info">
            <p>Please select a subject to view information.</p>
        </div>

    </div>

    <script>

        // Array containing subject information
        let subjects = [
            {
                name: "HTML",
                code: "BCA101",
                description: "HTML is used to create the structure of webpages.",
                credits: 4
            },

            {
                name: "CSS",
                code: "BCA102",
                description: "CSS is used to design and style webpages.",
                credits: 4
            },

            {
                name: "JavaScript",
                code: "BCA103",
                description: "JavaScript is used to make webpages interactive.",
                credits: 4
            },

            {
                name: "Database Management",
                code: "BCA104",
                description: "Database Management deals with storing and managing data.",
                credits: 4
            },

            {
                name: "C Programming",
                code: "BCA105",
                description: "C Programming teaches basic programming concepts.",
                credits: 4
            }
        ];

        // Function to display subject information
        function showSubjectInfo() {

            let selectedSubject =
                document.getElementById("subject").value;

            let info =
                document.getElementById("info");

            // Check if no subject is selected
            if (selectedSubject == "") {

                info.innerHTML =
                    "<p>Please select a subject to view information.</p>";

                return;
            }

            // Find selected subject in the array
            for (let i = 0; i < subjects.length; i++) {

                if (selectedSubject == subjects[i].name.toLowerCase().replace(" ", "")) {

                    info.innerHTML =
                        "<h3>" + subjects[i].name + "</h3>" +
                        "<p><b>Subject Code:</b> " +
                        subjects[i].code + "</p>" +
                        "<p><b>Description:</b> " +
                        subjects[i].description + "</p>" +
                        "<p><b>Credits:</b> " +
                        subjects[i].credits + "</p>";

                    break;
                }
            }
        }

    </script>

</body>
</html>
