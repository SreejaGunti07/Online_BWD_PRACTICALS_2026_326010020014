
<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Table</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;  
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        table {
            margin: auto;
            background-color: white;
        }

        th {
            background-color: lightblue;
            color: darkblue;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Student Marks Details</h1>

    <table border="1" cellpadding="8" cellspacing="0">

        <!-- Table Headings -->
        <tr>
            <th rowspan="2">Student Name</th>
            <th colspan="5">Subjects</th>
            <th rowspan="2">Total</th>
            <th rowspan="2">Percentage</th>
            <th rowspan="2">Grade</th>
        </tr>

        <tr>
            <th>HTML</th>
            <th>CSS</th>
            <th>C Programming</th>
            <th>Mathematics</th>
            <th>English</th>
        </tr>

        <!-- Student 1 -->
        <tr>
            <td>Rahul</td>
            <td>85</td>
            <td>80</td>
            <td>78</td>
            <td>88</td>
            <td>82</td>
            <td>413</td>
            <td>82.6%</td>
            <td>A</td>
        </tr>

        <!-- Student 2 -->
        <tr>
            <td>Amit</td>
            <td>75</td>
            <td>72</td>
            <td>80</td>
            <td>76</td>
            <td>78</td>
            <td>381</td>
            <td>76.2%</td>
            <td>B</td>
        </tr>

        <!-- Student 3 -->
        <tr>
            <td>Priya</td>
            <td>92</td>
            <td>89</td>
            <td>94</td>
            <td>90</td>
            <td>88</td>
            <td>453</td>
            <td>90.6%</td>
            <td>A+</td>
        </tr>

        <!-- Student 4 -->
        <tr>
            <td>Neha</td>
            <td>68</td>
            <td>74</td>
            <td>70</td>
            <td>72</td>
            <td>75</td>
            <td>359</td>
            <td>71.8%</td>
            <td>B</td>
        </tr>

    </table>

</body>
</html>
