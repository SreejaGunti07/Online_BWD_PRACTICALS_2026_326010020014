
<!DOCTYPE html>
<html>
<head>
    <title>College Event</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        .event {
            background-color: white;
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid gray;
        }

        img {
            width: 500px;
            max-width: 100%;
        }

        audio, video {
            margin: 10px;
            max-width: 100%;
        }

        h2 {
            color: darkblue;
        }
    </style>
</head>

<body>

    <h1>College Annual Event</h1>

    <div class="event">

        <h2>Annual Cultural Fest 2026</h2>

        <p>
            Welcome to our College Annual Cultural Fest.
            Enjoy the memorable moments of our college event.
        </p>


        <!-- Event Photograph -->
        <h2>Event Photograph</h2>

        <img src="event-photo.jpg"
             alt="College Annual Event Photograph">


        <!-- Promotional Audio -->
        <h2>Promotional Audio</h2>

        <audio controls>
            <source src="event-audio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>


        <!-- Event Video -->
        <h2>Event Video</h2>

        <video width="600" controls>
            <source src="event-video.mp4" type="video/mp4">
            Your browser does not support the video element.
        </video>

    </div>

</body>
</html>
